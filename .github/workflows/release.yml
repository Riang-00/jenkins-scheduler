name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m unittest discover -s tests -v
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run lint
        working-directory: desktop
      - run: bun run typecheck
        working-directory: desktop
      - run: bun run tauri build --no-bundle
        working-directory: desktop
      - run: python tools/build_release.py --exe desktop/src-tauri/target/release/tauri-native.exe --revision "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: |
            artifacts/*setup.exe
            artifacts/SHA256SUMS.txt
      - name: Create draft only when the tag has no release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --json id 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create "$env:GITHUB_REF_NAME" artifacts/*setup.exe artifacts/SHA256SUMS.txt --draft --generate-notes --title "Jenkins Scheduler $env:GITHUB_REF_NAME"
